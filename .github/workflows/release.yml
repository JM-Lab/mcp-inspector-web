name: Release

# Push a tag such as v0.2.0 (npm version minor && git push --follow-tags) to publish that version to npm.
# Uses npm trusted publishing (OIDC): no token is stored, and provenance is added by npm itself. Set it up once on
# npmjs.com under the package's Settings → Trusted publisher (organization JM-Lab, repository mcp-inspector-web,
# workflow release.yml). The very first version is published by hand, since the package must exist for that setting;
# its tag then only makes the GitHub release, as npm already has that version.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Already on npm?
        id: npm
        run: |
          # npm view prints nothing (and still succeeds) for a version the package does not have.
          v=$(npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version 2>/dev/null || true)
          if [ -n "$v" ]; then echo "published=true" >> "$GITHUB_OUTPUT"; fi
      # prepublishOnly runs the same checks as CI (tests with the browser ones, types, build): if any fails, nothing is published.
      - if: steps.npm.outputs.published != 'true'
        run: npm publish
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
