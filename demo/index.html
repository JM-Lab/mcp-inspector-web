<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP Inspector Web</title>
<meta name="description" content="An MCP Inspector that runs entirely in the browser. Connect to a remote MCP server, run its tools, prompts and resources, and read every message.">
<link rel="stylesheet" href="mcp-inspector.css">
<style>
  :root{color-scheme:light dark}
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:Canvas;color:CanvasText}
  main{max-width:72rem;margin:0 auto;padding:1.5rem 1rem 3rem}
  h1{margin:0;font-size:1.8rem}
  p.lede{margin:.4rem 0 1.4rem;opacity:.75}
  a{color:inherit}
  /* Title on the left, the repository on the right of the same row: the GitHub mark, with its name where there is room. */
  header{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
  header h1{min-width:0}
  .repo{flex-shrink:0;display:inline-flex;align-items:center;gap:.4rem;height:2.25rem;padding:0 .7rem;border-radius:999px;font-size:.85rem;font-weight:600;text-decoration:none;opacity:.8}
  .repo:hover{opacity:1;background:color-mix(in srgb,CanvasText 8%,transparent)}
  .repo svg{width:22px;height:22px;fill:currentColor}
  @media (max-width:560px){.repo{width:2.25rem;padding:0;justify-content:center}.repo span{display:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>MCP Inspector Web</h1>
    <a class="repo" href="https://github.com/JM-Lab/mcp-inspector-web" target="_blank" rel="noopener" title="Open source on GitHub" aria-label="Open source on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>GitHub</span>
    </a>
  </header>
  <p class="lede">Test a remote MCP server in your browser, with nothing to install.</p>
  <div id="mcpi"><noscript>This page needs JavaScript.</noscript></div>
</main>
<script>window.MCP_INSPECTOR = { lang: new URLSearchParams(location.search).get('lang') || (navigator.language.startsWith('ko') ? 'ko' : 'en'), featured: 'featured.json' }</script>
<script src="mcp-inspector.js" defer></script>
</body>
</html>
