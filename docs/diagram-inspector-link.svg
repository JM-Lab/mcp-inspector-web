<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 150" width="820" height="150" role="img" aria-label="Inspector link: you send a link, they open it in any browser, the server opens connected, and they run its tools" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><title>Inspector link: you send a link, they open it in any browser, the server opens connected, and they run its tools</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#5b6b80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="820" height="150" rx="12" fill="#f6f8fb"/><g transform="translate(28,20) scale(0.8333333333333334)" fill="none" stroke="#1f5fbf" stroke-width="2" stroke-linecap="round"><path d="M9 3h6"/><path d="M10 3v6l-5.2 9a2 2 0 0 0 1.7 3h11a2 2 0 0 0 1.7-3L14 9V3"/><path d="M7.5 15h9"/></g><text x="56" y="36" font-size="14.5" font-weight="600" fill="#0b1f3a">Inspector link</text><text x="166" y="36" font-size="12.5" fill="#5b6b80">"try this server"</text><rect x="28" y="56" width="176" height="66" rx="9" fill="#fff" stroke="#1f5fbf" stroke-width="1.6"/><text x="116.0" y="85.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">You send a link</text><text x="116.0" y="102.0" text-anchor="middle" font-size="11.5" fill="#1f5fbf" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">?r=&lt;name&gt;</text><rect x="226" y="56" width="176" height="66" rx="9" fill="#fff" stroke="#d5dde8" stroke-width="1.2"/><text x="314.0" y="85.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">They open it</text><text x="314.0" y="102.0" text-anchor="middle" font-size="12" fill="#5b6b80">in any browser, no install</text><rect x="424" y="56" width="176" height="66" rx="9" fill="#fff" stroke="#d5dde8" stroke-width="1.2"/><text x="512.0" y="85.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">Opens, connected</text><text x="512.0" y="102.0" text-anchor="middle" font-size="12" fill="#5b6b80">tools, prompts, resources</text><rect x="622" y="56" width="176" height="66" rx="9" fill="#fff" stroke="#1a7f37" stroke-width="1.6"/><text x="710.0" y="85.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">They run its tools</text><text x="710.0" y="102.0" text-anchor="middle" font-size="12" fill="#5b6b80">and see every request</text><path d="M207 89L222 89" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M405 89L420 89" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M603 89L618 89" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#a)"/></svg>
