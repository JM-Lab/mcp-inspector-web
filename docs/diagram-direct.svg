<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 236" width="820" height="236" role="img" aria-label="MCP Inspector Web runs in a browser tab and talks to the remote MCP server directly; a local inspector goes through a proxy on your computer" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><title>MCP Inspector Web runs in a browser tab and talks to the remote MCP server directly; a local inspector goes through a proxy on your computer</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#5b6b80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="820" height="236" rx="12" fill="#f6f8fb"/><text x="28" y="34" text-anchor="start" font-size="13.5" fill="#0b1f3a" font-weight="600">MCP Inspector Web</text><text x="176" y="34" text-anchor="start" font-size="12" fill="#5b6b80" font-weight="400">a page: nothing to install, nothing in between</text><rect x="28" y="48" width="250" height="62" rx="9" fill="#fff" stroke="#1f5fbf" stroke-width="1.6"/><text x="153.0" y="75.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">Your browser tab</text><text x="153.0" y="92.0" text-anchor="middle" font-size="12" fill="#5b6b80">the inspector page</text><rect x="542" y="48" width="250" height="62" rx="9" fill="#fff" stroke="#d5dde8" stroke-width="1.2"/><text x="667.0" y="75.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">Remote MCP server</text><text x="667.0" y="92.0" text-anchor="middle" font-size="12" fill="#5b6b80">Streamable HTTP, browsers allowed</text><path d="M286 79L534 79" stroke="#1f5fbf" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><text x="410" y="70" text-anchor="middle" font-size="12" fill="#1f5fbf" font-weight="400">requests go straight from your browser</text><text x="410" y="97" text-anchor="middle" font-size="11.5" fill="#5b6b80" font-weight="400">tokens stay in the tab</text><path d="M28 130H792" stroke="#d5dde8" stroke-width="1" stroke-dasharray="4 4"/><text x="28" y="156" text-anchor="start" font-size="13.5" fill="#0b1f3a" font-weight="600">A local inspector</text><text x="158" y="156" text-anchor="start" font-size="12" fill="#5b6b80" font-weight="400">an app or npx on your computer: also reaches stdio servers and servers that block browsers</text><rect x="28" y="168" width="170" height="48" rx="9" fill="#fff" stroke="#d5dde8" stroke-width="1.2"/><text x="113.0" y="196.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">Browser or app</text><rect x="288" y="168" width="220" height="48" rx="9" fill="#fff" stroke="#d5dde8" stroke-width="1.2"/><text x="398.0" y="188.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">Local proxy / process</text><text x="398.0" y="205.0" text-anchor="middle" font-size="12" fill="#5b6b80">on your computer</text><rect x="598" y="168" width="194" height="48" rx="9" fill="#fff" stroke="#d5dde8" stroke-width="1.2"/><text x="695.0" y="188.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">Any MCP server</text><text x="695.0" y="205.0" text-anchor="middle" font-size="12" fill="#5b6b80">remote or stdio</text><path d="M204 192L282 192" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><path d="M514 192L592 192" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#a)" marker-start="url(#a)"/></svg>
