<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img" aria-label="Which inspector to use: MCP Inspector Web for remote servers a browser can reach, a local inspector for stdio servers and servers that block browsers" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><title>Which inspector to use: MCP Inspector Web for remote servers a browser can reach, a local inspector for stdio servers and servers that block browsers</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#5b6b80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="820" height="250" rx="12" fill="#f6f8fb"/><rect x="28" y="28" width="250" height="70" rx="9" fill="#fff" stroke="#d5dde8" stroke-width="1.2"/><text x="153.0" y="67.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">Your MCP server is</text><rect x="28" y="28" width="250" height="70" rx="9" fill="#fff" stroke="#d5dde8" stroke-width="1.2"/><text x="153.0" y="67.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">Your MCP server is</text><rect x="330" y="24" width="462" height="78" rx="9" fill="#fff" stroke="#1f5fbf" stroke-width="1.6"/><text x="561.0" y="50.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">Remote, Streamable HTTP, allows browsers (CORS)</text><text x="561.0" y="67.5" text-anchor="middle" font-size="12" fill="#5b6b80">MCP Inspector Web: open the page, or send a link</text><text x="561.0" y="84.5" text-anchor="middle" font-size="11.5" fill="#1f5fbf" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">aljal.kr/miw</text><rect x="330" y="124" width="462" height="102" rx="9" fill="#fff" stroke="#d5dde8" stroke-width="1.2"/><text x="561.0" y="154.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">stdio, blocks browsers, HTTP+SSE, or needs sampling</text><text x="561.0" y="171.0" text-anchor="middle" font-size="12" fill="#5b6b80">An inspector on your computer:</text><text x="561.0" y="188.0" text-anchor="middle" font-size="12" fill="#5b6b80">Spring AI Playground (desktop app)</text><text x="561.0" y="205.0" text-anchor="middle" font-size="12" fill="#5b6b80">or the official MCP Inspector (npx)</text><path d="M278 63H326" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M153 98V175H326" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="302" y="54" text-anchor="middle" font-size="11.5" fill="#1a7f37" font-weight="600">yes</text><text x="240" y="167" text-anchor="middle" font-size="11.5" fill="#5b6b80" font-weight="600">otherwise</text></svg>
