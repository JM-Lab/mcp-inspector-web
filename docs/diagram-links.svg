<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 292" width="820" height="292" role="img" aria-label="The inspector link opens a server ready to try; the connect link tests it and then adds it to the AI client named in the link" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><title>The inspector link opens a server ready to try; the connect link tests it and then adds it to the AI client named in the link</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#5b6b80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="820" height="292" rx="12" fill="#f6f8fb"/><g transform="translate(28,20) scale(0.8333333333333334)" fill="none" stroke="#1f5fbf" stroke-width="2" stroke-linecap="round"><path d="M9 3h6"/><path d="M10 3v6l-5.2 9a2 2 0 0 0 1.7 3h11a2 2 0 0 0 1.7-3L14 9V3"/><path d="M7.5 15h9"/></g><text x="56" y="36" text-anchor="start" font-size="14.5" fill="#0b1f3a" font-weight="600">Inspector link</text><text x="166" y="36" text-anchor="start" font-size="12.5" fill="#5b6b80" font-weight="400">"try this server"</text><rect x="28" y="52" width="176" height="66" rx="9" fill="#fff" stroke="#1f5fbf" stroke-width="1.6"/><text x="116.0" y="81.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">You send a link</text><text x="116.0" y="98.0" text-anchor="middle" font-size="11.5" fill="#1f5fbf" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">?r=&lt;name&gt;</text><rect x="226" y="52" width="176" height="66" rx="9" fill="#fff" stroke="#d5dde8" stroke-width="1.2"/><text x="314.0" y="81.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">They open it</text><text x="314.0" y="98.0" text-anchor="middle" font-size="12" fill="#5b6b80">in any browser, no install</text><rect x="424" y="52" width="176" height="66" rx="9" fill="#fff" stroke="#d5dde8" stroke-width="1.2"/><text x="512.0" y="81.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">Opens, connected</text><text x="512.0" y="98.0" text-anchor="middle" font-size="12" fill="#5b6b80">tools, prompts, resources</text><rect x="622" y="52" width="176" height="66" rx="9" fill="#fff" stroke="#1a7f37" stroke-width="1.6"/><text x="710.0" y="81.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">They run its tools</text><text x="710.0" y="98.0" text-anchor="middle" font-size="12" fill="#5b6b80">and see every request</text><path d="M207 85L222 85" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M405 85L420 85" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M603 85L618 85" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M28 144H792" stroke="#d5dde8" stroke-width="1" stroke-dasharray="4 4"/><g transform="translate(28,154) scale(0.8333333333333334)" fill="none" stroke="#1f5fbf" stroke-width="2" stroke-linecap="round"><path d="M9 2v5"/><path d="M15 2v5"/><path d="M6 7h12v4a6 6 0 0 1-12 0V7z"/><path d="M12 17v5"/><path d="M12.8 8.6l-2.2 2.9h2.8l-2.2 2.9"/></g><text x="56" y="170" text-anchor="start" font-size="14.5" fill="#0b1f3a" font-weight="600">Connect link</text><text x="156" y="170" text-anchor="start" font-size="12.5" fill="#5b6b80" font-weight="400">"add this server to your AI client"</text><rect x="28" y="186" width="176" height="66" rx="9" fill="#fff" stroke="#1f5fbf" stroke-width="1.6"/><text x="116.0" y="215.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">You send a link</text><text x="116.0" y="232.0" text-anchor="middle" font-size="11.5" fill="#1f5fbf" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">?r=&lt;name&gt;&amp;to=vscode</text><rect x="226" y="186" width="176" height="66" rx="9" fill="#fff" stroke="#d5dde8" stroke-width="1.2"/><text x="314.0" y="215.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">Opens and connects</text><text x="314.0" y="232.0" text-anchor="middle" font-size="12" fill="#5b6b80">so they see it answer first</text><rect x="424" y="186" width="176" height="66" rx="9" fill="#fff" stroke="#d5dde8" stroke-width="1.2"/><text x="512.0" y="215.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">Add to AI opens</text><text x="512.0" y="232.0" text-anchor="middle" font-size="12" fill="#5b6b80">on the client in the link</text><rect x="622" y="186" width="176" height="66" rx="9" fill="#fff" stroke="#1a7f37" stroke-width="1.6"/><text x="710.0" y="215.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b1f3a">Added to VS Code</text><text x="710.0" y="232.0" text-anchor="middle" font-size="12" fill="#5b6b80">one click, or its command</text><path d="M207 219L222 219" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M405 219L420 219" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M603 219L618 219" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="28" y="276" text-anchor="start" font-size="12" fill="#5b6b80" font-weight="400">A link never carries a token, only the header name. OAuth starts only when its button is pressed.</text></svg>
